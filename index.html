<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to TCT Walmart</title>
    <style>
        :root { --customer-green: #10b981; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #0f172a; margin: 0; padding: 2rem; display: flex; justify-content: center; align-items: center; min-height: 80vh; }
        .menu-container { width: 100%; max-width: 500px; background: #1e293b; padding: 3rem 2rem; border-radius: 1rem; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); color: #f8fafc; }
        .welcome-emoji { font-size: 3.5rem; display: block; margin-bottom: 0.5rem; }
        h1 { margin: 0; font-size: 2.2rem; color: var(--customer-green); letter-spacing: 0.05em; font-weight: 900; }
        h2 { margin: 0.25rem 0; font-size: 1.2rem; color: #94a3b8; font-weight: 600; }
        .holiday-subtitle { font-size: 0.9rem; color: #f43f5e; font-weight: bold; margin: 0.5rem 0 2rem 0; }
        .start-game-btn { display: inline-block; background: linear-gradient(135deg, #10b981, #059669); color: #0f172a; text-decoration: none; font-weight: 800; font-size: 1.1rem; padding: 0.85rem 2rem; border-radius: 2rem; box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3); transition: transform 0.2s; width: 80%; box-sizing: border-box; }
        .start-game-btn:hover { transform: translateY(-2px); }
        .menu-hint { font-size: 0.75rem; color: #475569; margin-top: 2rem; }
    </style>
</head>
<body>

    <div class="menu-container">
        <header>
            <span class="welcome-emoji">🏪</span>
            <h1>TCT STORES</h1>
            <h2>Walmart Tycoon Simulator</h2>
            <p class="holiday-subtitle">❤️ Long Weekend Special Edition ❤️</p>
        </header>
        <main>
            <a href="game.html" class="start-game-btn">🚀 Start Tycoon Game</a>
            <p class="menu-hint">Built for Mom & Dad • Secure Private Edition</p>
        </main>
    </div>

</body>
</html>
